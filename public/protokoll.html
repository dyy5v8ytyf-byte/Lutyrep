<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prüf- und Reparaturprotokoll – Westphal Wavetec</title>
<style>
  :root{--navy:#1f3350;--bronze:#a87b45;--border:#cfd6df;--text:#1e252d;--muted:#5d6874;--ok:#1f7a48;--bad:#a13a3a;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef1f5;color:var(--text);padding:24px 16px 60px;}
  .page{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:6px;padding:34px 40px;}
  .controls{max-width:820px;margin:0 auto 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.88rem;}
  .controls button{border:none;background:var(--navy);color:#fff;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:.88rem;}
  .controls label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .controls .hint{color:var(--muted);font-size:.8rem;}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:18px;}
  .brand{display:flex;gap:12px;align-items:center;}
  .brand .name{font-weight:800;font-size:1.05rem;color:var(--navy);letter-spacing:.01em;}
  .brand .addr{font-size:.75rem;color:var(--muted);line-height:1.4;}
  .doc{text-align:right;}
  .doc h1{margin:0;font-size:1.15rem;color:var(--navy);}
  .doc .sub{font-size:.75rem;color:var(--muted);margin-top:3px;}
  h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--bronze);margin:20px 0 6px;border-bottom:1px solid var(--border);padding-bottom:3px;}
  table.kv{width:100%;border-collapse:collapse;font-size:.88rem;}
  table.kv td{padding:4px 0;vertical-align:top;}
  table.kv td.k{color:var(--muted);width:38%;padding-right:12px;}
  table.list{width:100%;border-collapse:collapse;font-size:.86rem;}
  table.list th{text-align:left;font-size:.72rem;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);padding:4px 6px;}
  table.list td{padding:5px 6px;border-bottom:1px solid #eef1f5;}
  .txt{font-size:.88rem;white-space:pre-wrap;line-height:1.45;}
  .io-ok{color:var(--ok);font-weight:700;}
  .io-bad{color:var(--bad);font-weight:700;}
  .result{margin-top:10px;padding:10px 12px;border-radius:6px;font-weight:700;font-size:.92rem;}
  .result.ok{background:#e9f6ee;color:var(--ok);border:1px solid #bfe3c8;}
  .result.bad{background:#fbeaea;color:var(--bad);border:1px solid #f0c3c3;}
  .result.open{background:#f4f6f9;color:var(--muted);border:1px solid var(--border);}
  .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px;font-size:.78rem;color:var(--muted);}
  .sign div{border-top:1px solid var(--text);padding-top:4px;}
  .foot{margin-top:26px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);padding-top:8px;}
  .err{max-width:820px;margin:0 auto;background:#fbeaea;color:var(--bad);padding:14px;border-radius:8px;}
  @media print{
    body{background:#fff;padding:0;}
    .controls{display:none;}
    .page{border:none;border-radius:0;padding:0;max-width:none;}
    h2,.result{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  @media (max-width:560px){
    .page{padding:20px 16px;}
    .head{flex-direction:column;}
    .doc{text-align:left;}
    .sign{grid-template-columns:1fr;gap:28px;}
  }
</style>
</head>
<body>
<div class="controls" id="controls">
  <button type="button" id="printBtn">🖨 Drucken / als PDF speichern</button>
  <label><input type="checkbox" id="kvToggle"> KV-Betrag (netto) im Protokoll anzeigen</label>
  <span class="hint">Das Protokoll enthält keine Einkaufs-/Verkaufspreise und keine internen Notizen.</span>
</div>
<div id="root"></div>

<script>
(function(){
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(iso){ if(!iso) return '–'; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('de-DE'); }
  function fmtEUR(n){ return (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
  function io(v, okVal){ if(v === okVal) return '<span class="io-ok">i.O.</span>'; if(v == null || v === '') return '–'; return '<span class="io-bad">n.i.O.</span>'; }
  // Messwerte im deutschen Format (Dezimalkomma), Eingabe bleibt unverändert gespeichert
  function wert(v, einheit){
    if(v === '' || v == null) return '–';
    const n = Number(String(v).replace(',', '.'));
    const t = isNaN(n) ? esc(v) : n.toLocaleString('de-DE', { maximumFractionDigits: 4 });
    return t + (einheit ? ' ' + einheit : '');
  }

  // Kompassrose als Platzhalter-Logo (Navy/Bronze) bis zur offiziellen Datei
  const KOMPASS = '<svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#1f3350" stroke-width="4"/><circle cx="50" cy="50" r="36" fill="none" stroke="#a87b45" stroke-width="1.5"/><polygon points="50,8 57,50 50,92 43,50" fill="#1f3350"/><polygon points="8,50 50,43 92,50 50,57" fill="#a87b45"/><polygon points="50,8 57,50 50,50" fill="#a87b45"/><circle cx="50" cy="50" r="4" fill="#fff" stroke="#1f3350" stroke-width="2"/></svg>';

  const params = new URLSearchParams(location.search);
  const auftragId = params.get('id');
  const archivId = params.get('archiv');
  const root = document.getElementById('root');
  let quelle = null, CONFIG = { messgroessen: [], fehlerkategorien: [] };

  try { document.getElementById('kvToggle').checked = localStorage.getItem('lutyrep_protokoll_kv') === '1'; } catch(_) {}
  document.getElementById('kvToggle').addEventListener('change', e => {
    try { localStorage.setItem('lutyrep_protokoll_kv', e.target.checked ? '1' : '0'); } catch(_) {}
    render();
  });
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  async function laden(){
    try {
      const url = archivId ? '/api/archiv/' + encodeURIComponent(archivId) : '/api/auftraege/' + encodeURIComponent(auftragId || '');
      const r = await fetch(url);
      if(!r.ok) throw new Error('Auftrag nicht gefunden');
      quelle = await r.json();
      try { CONFIG = await (await fetch('/api/config')).json(); } catch(_) {}
      render();
    } catch(e){
      document.getElementById('controls').style.display = 'none';
      root.innerHTML = '<div class="err">Protokoll konnte nicht geladen werden: ' + esc(e.message) + '</div>';
    }
  }

  function render(){
    const a = quelle, d = a.daten || {}, st = d.state || {}, tx = d.texts || {};
    const si2 = d.sicherheit || {}, si3 = d.sicherheit3 || {}, v = d.versand || {}, seg = d.testSeg || {};
    const staff = d.staff || {}, ze = d.zeitenExtra || {};
    const mgName = id => { const e = (CONFIG.messgroessen || []).find(x => x.id === id); return e ? e.name : id; };
    const mgEinh = id => { const e = (CONFIG.messgroessen || []).find(x => x.id === id); return e && e.einheit ? e.einheit : ''; };
    const katName = id => { const e = (CONFIG.fehlerkategorien || []).find(x => x.id === id); return e ? e.name : id; };
    const auftragsNr = a.auftragId || a.id;
    // Prüfer: Mitarbeiter aus Schritt 3 (E-Werkstatt), sonst letzter weiterer Zeiteintrag in Schritt 3
    let pruefer = (staff.step3 && staff.step3.mitarbeiter) || '';
    if(!pruefer && Array.isArray(ze['3']) && ze['3'].length) pruefer = ze['3'][ze['3'].length - 1].mitarbeiter || '';
    const sk = si2.schutzklasse ? 'Schutzklasse ' + esc(si2.schutzklasse) : '–';
    const skI = !(si2.schutzklasse === 'II' || si2.schutzklasse === 'III');
    const teile = (d.ersatzteile || []).filter(p => p && p.gebucht !== false);
    const mw3 = d.messwerte3 || {};
    const mw3Ids = Object.keys(mw3).filter(k => String(mw3[k] ?? '').trim() !== '');
    const kats = (d.fehlerkategorien || []).map(katName);
    const zeigeKV = document.getElementById('kvToggle').checked && Number(st.kvBetrag) > 0;

    let gesamt = 'open', gesamtText = 'Prüfung noch nicht abgeschlossen';
    if(st.testok === 'ja' && st.sicherheit3 === 'ja'){ gesamt = 'ok'; gesamtText = '✓ Gerät instand gesetzt, geprüft und in Ordnung'; }
    else if(st.sicherheit3 === 'nein' || st.testok === 'nein'){ gesamt = 'bad'; gesamtText = '✗ Prüfung nicht bestanden – Gerät nicht freigegeben'; }

    let h = '<div class="page">';
    h += '<div class="head"><div class="brand">' + KOMPASS + '<div><div class="name">Westphal Wavetec GmbH</div><div class="addr">Kurt-Fischer-Straße 28a · 22926 Ahrensburg</div></div></div>' +
         '<div class="doc"><h1>Prüf- und Reparaturprotokoll</h1><div class="sub">Auftrag Nr. ' + esc(auftragsNr) + (a.wawi ? ' · WAWI ' + esc(a.wawi) : '') + '</div><div class="sub">Erstellt am ' + fmtDate(new Date().toISOString()) + '</div></div></div>';

    h += '<h2>Gerät &amp; Kunde</h2><table class="kv">' +
      '<tr><td class="k">Kunde</td><td>' + (esc(a.kunde) || '–') + '</td></tr>' +
      '<tr><td class="k">Gerätetyp</td><td>' + (esc(a.geraet) || '–') + '</td></tr>' +
      '<tr><td class="k">Seriennummer</td><td>' + (esc(a.serien) || '–') + '</td></tr>' +
      '<tr><td class="k">Eingang</td><td>' + fmtDate((d.meta && d.meta.datum) || a.erstelltAm) + '</td></tr>' +
      (v.datum ? '<tr><td class="k">Versand / Rückgabe</td><td>' + fmtDate(v.datum) + (v.art ? ' · ' + esc(v.art) : '') + (v.sendungsnr ? ' · Sendungs-Nr. ' + esc(v.sendungsnr) : '') + '</td></tr>' : '') +
      (v.lieferschein ? '<tr><td class="k">Lieferschein-Nr.</td><td>' + esc(v.lieferschein) + '</td></tr>' : '') +
      '</table>';

    h += '<h2>Fehlerbild &amp; Befund</h2><table class="kv">' +
      '<tr><td class="k">Fehlerbeschreibung Kunde</td><td class="txt">' + (esc(tx.ta_fehler_kunde) || '–') + '</td></tr>' +
      (st.defekt === 'ja' && tx.ta_defekt_komponenten ? '<tr><td class="k">Beim Eingang festgestellte Schäden</td><td class="txt">' + esc(tx.ta_defekt_komponenten) + '</td></tr>' : '') +
      '<tr><td class="k">Befund Werkstatt</td><td class="txt">' + (esc(tx.ta_fehler_techniker) || '–') + '</td></tr>' +
      (kats.length ? '<tr><td class="k">Fehlerkategorie</td><td>' + kats.map(esc).join(', ') + '</td></tr>' : '') +
      '</table>';

    h += '<h2>Durchgeführte Arbeiten</h2>';
    if(tx.ta_austausch_komponenten) h += '<div class="txt" style="margin-bottom:8px;">' + esc(tx.ta_austausch_komponenten) + '</div>';
    h += teile.length
      ? '<table class="list"><thead><tr><th>Ausgetauschte Komponente</th><th>Art.-Nr.</th><th style="text-align:right;">Menge</th></tr></thead><tbody>' +
        teile.map(p => '<tr><td>' + esc(p.name) + '</td><td>' + (esc(p.nummer) || '–') + '</td><td style="text-align:right;">' + esc(p.qty) + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="txt">Keine Komponenten ausgetauscht.</div>';

    h += '<h2>Funktionsprüfung</h2><table class="kv">' +
      '<tr><td class="k">Standardkopf – Schall</td><td>' + io(seg.schall, 'ok') + '</td></tr>' +
      '<tr><td class="k">Standardkopf – Reset</td><td>' + io(seg.reset, 'ok') + '</td></tr>' +
      mw3Ids.map(id => '<tr><td class="k">' + esc(mgName(id)) + '</td><td>' + wert(mw3[id], esc(mgEinh(id))) + '</td></tr>').join('') +
      '</table>';

    h += '<h2>Elektrische Sicherheitsprüfung nach Instandsetzung (DIN EN 50678 / VDE 0701)</h2><table class="kv">' +
      '<tr><td class="k">Schutzklasse</td><td>' + sk + '</td></tr>' +
      (skI ? '<tr><td class="k">Schutzleiterwiderstand R<sub>PE</sub></td><td>' + wert(si3.rpe, 'Ω') + '</td></tr>' : '') +
      '<tr><td class="k">Isolationswiderstand R<sub>ISO</sub></td><td>' + wert(si3.riso, 'MΩ') + '</td></tr>' +
      (si3.ableit !== '' && si3.ableit != null ? '<tr><td class="k">Schutzleiter-/Berührungsstrom</td><td>' + wert(si3.ableit, 'mA') + '</td></tr>' : '') +
      '<tr><td class="k">Prüfgerät</td><td>' + (esc(si3.geraet) || esc(si2.geraet) || '–') + '</td></tr>' +
      '<tr><td class="k">Ergebnis</td><td>' + io(st.sicherheit3, 'ja') + '</td></tr>' +
      '</table>';

    h += '<h2>Endkontrolle</h2><table class="kv">' +
      '<tr><td class="k">Sicht-/Endkontrolle</td><td>' + io(st.endkontrolle, 'ja') + '</td></tr>' +
      '<tr><td class="k">Vollständigkeit lt. Eingang</td><td>' + (st.vollstaendig === 'ja' ? '<span class="io-ok">vollständig</span>' : st.vollstaendig === 'nein' ? '<span class="io-bad">Abweichung</span>' + (tx.ta_abweichung_komponenten ? ': ' + esc(tx.ta_abweichung_komponenten) : '') : '–') + '</td></tr>' +
      (tx.ta_komponenten_eingang ? '<tr><td class="k">Beim Eingang erfasste Komponenten</td><td class="txt">' + esc(tx.ta_komponenten_eingang) + '</td></tr>' : '') +
      '</table>';

    if(zeigeKV){
      h += '<h2>Kosten</h2><table class="kv"><tr><td class="k">Kostenvoranschlag (netto, zzgl. gesetzl. USt.)</td><td><b>' + fmtEUR(st.kvBetrag) + '</b></td></tr></table>';
    }

    h += '<div class="result ' + gesamt + '">' + gesamtText + '</div>';
    h += '<div class="sign"><div>Prüfer' + (pruefer ? ': ' + esc(pruefer) : '') + ' · Datum / Unterschrift</div><div>Stempel Westphal Wavetec GmbH</div></div>';
    h += '<div class="foot">Die Messwerte beziehen sich auf den Zustand des Geräts zum Zeitpunkt der Prüfung. Dieses Protokoll ist Bestandteil der Reparaturdokumentation zu Auftrag ' + esc(auftragsNr) + '.</div>';
    h += '</div>';
    root.innerHTML = h;
    document.title = 'Prüfprotokoll ' + (a.serien || auftragsNr) + ' – Westphal Wavetec';
  }

  laden();
})();
</script>
</body>
</html>
