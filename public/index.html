<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutyrep – Reparaturaufträge</title>
<style>
  :root{
    --navy:#2E4057; --navy-dark:#1c2a3a; --light:#EEF2F7; --border:#D6DEE7;
    --green:#2f9e63; --red:#c94b4b; --amber:#c98a2c; --text:#242c35; --muted:#6b7684;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f9;color:var(--text);padding:24px 16px 60px;}
  .wrap{max-width:1000px;margin:0 auto;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#fff;border-radius:14px;padding:24px 28px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  header h1{margin:0 0 4px;font-size:1.5rem;}
  header p{margin:0;color:#cbd6e2;font-size:.9rem;}
  .newBtn{border:none;background:#7fd3a4;color:#12331f;font-weight:800;border-radius:9px;padding:12px 20px;font-size:.95rem;cursor:pointer;}
  .newBtn:hover{filter:brightness(1.05);}
  .toolsRow{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .toolsRow a{text-decoration:none;background:#fff;border:1px solid var(--border);color:var(--navy-dark);padding:8px 14px;border-radius:8px;font-size:.85rem;font-weight:600;}
  .toolsRow a:hover{background:var(--light);}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border);}
  thead th{background:var(--light);text-align:left;padding:10px 14px;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--border);}
  tbody td{padding:11px 14px;font-size:.9rem;border-bottom:1px solid #eef1f5;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfcfe;cursor:pointer;}
  .status-pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:700;}
  .st-neu{background:#eef2f7;color:var(--muted);}
  .st-arbeit{background:#fbf1de;color:#8a5c0f;}
  .st-warten{background:#fdeeee;color:#a13a3a;}
  .st-fertig{background:#e5f6ec;color:#1f7a48;}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:.9rem;}
  .del{border:none;background:none;color:var(--red);cursor:pointer;font-size:.85rem;}
  footer{margin-top:20px;font-size:.75rem;color:var(--muted);text-align:center;}

  @media (max-width: 480px){
    body{padding:14px 10px 40px;}
    header{padding:16px 18px;}
    header h1{font-size:1.2rem;}
    .newBtn{width:100%;}
    thead th, tbody td{padding:8px 8px;font-size:.8rem;}
    .status-pill{font-size:.7rem;padding:2px 7px;}
  }

  /* Eigenes Dialogfenster statt window.confirm() – native Dialoge werden in eingebetteten
     Ansichten teils blockiert und würden den Löschen-Button wirkungslos wirken lassen. */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(28,42,58,.55);align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:12px;padding:20px 22px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal-msg{font-size:.92rem;line-height:1.5;color:var(--text);margin-bottom:14px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  .modal-actions button{border:none;border-radius:8px;padding:10px 16px;font-size:.87rem;font-weight:600;cursor:pointer;}
  .modal-btn-ok{background:var(--red);color:#fff;}
  .modal-btn-cancel{background:#fff;color:var(--muted);border:1px solid var(--border)!important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Lutyrep</h1>
      <p>Reparaturaufträge – Wwtec · gemeinsame Übersicht</p>
    </div>
    <button class="newBtn" id="newAuftragBtn">+ Neuer Auftrag</button>
  </header>

  <div class="toolsRow">
    <a href="lager.html">📦 Lagerbestand verwalten</a>
    <a href="archiv.html">🗄️ Archiv – abgeschlossene Checklisten</a>
  </div>

  <table>
    <thead>
      <tr><th>Kunde</th><th>Gerätetyp</th><th>Serien-Nr.</th><th>Status</th><th>Zuletzt geändert</th><th></th></tr>
    </thead>
    <tbody id="tbody"><tr><td colspan="6" class="empty">Lädt…</td></tr></tbody>
  </table>

  <footer>Lutyrep v1.0 · Alle Daten liegen zentral auf diesem Server – jeder Nutzer sieht denselben, aktuellen Stand.</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" id="modalCancelBtn" type="button">Abbrechen</button>
      <button class="modal-btn-ok" id="modalOkBtn" type="button">Löschen</button>
    </div>
  </div>
</div>

<script>
function showConfirm(message){
  return new Promise((resolve)=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    overlay.classList.add('show');
    const okBtn = document.getElementById('modalOkBtn');
    const cancelBtn = document.getElementById('modalCancelBtn');
    function cleanup(result){
      overlay.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}
function statusClass(s){
  if(!s) return 'st-neu';
  if(s.includes('Versendet') || s.includes('Abgeschlossen')) return 'st-fertig';
  if(s.includes('Wartet')) return 'st-warten';
  if(s === 'Neuer Auftrag') return 'st-neu';
  return 'st-arbeit';
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
async function load(){
  const res = await fetch('/api/auftraege');
  const rows = await res.json();
  const tbody = document.getElementById('tbody');
  if(!rows.length){
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Noch keine Aufträge angelegt – oben auf „+ Neuer Auftrag" klicken.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr onclick="location.href='auftrag.html?id=${r.id}'">
      <td>${r.kunde || '–'}</td>
      <td>${r.geraet || '–'}</td>
      <td>${r.serien || '–'}</td>
      <td><span class="status-pill ${statusClass(r.status)}">${r.status}</span></td>
      <td>${fmtDate(r.aktualisiertAm)}</td>
      <td><button class="del" onclick="event.stopPropagation(); del(${r.id})">löschen</button></td>
    </tr>
  `).join('');
}
async function del(id){
  const ok = await showConfirm('Diesen Auftrag endgültig löschen?');
  if(!ok) return;
  await fetch('/api/auftraege/' + id, { method:'DELETE' });
  load();
}
document.getElementById('newAuftragBtn').addEventListener('click', async ()=>{
  const res = await fetch('/api/auftraege', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({daten:{}}) });
  const { id } = await res.json();
  location.href = 'auftrag.html?id=' + id;
});
load();
</script>
</body>
</html>
