<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutyrep – Lagerbestand</title>
<style>
  :root{--navy:#2E4057;--navy-dark:#1c2a3a;--light:#EEF2F7;--border:#D6DEE7;--green:#2f9e63;--red:#c94b4b;--text:#242c35;--muted:#6b7684;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f9;color:var(--text);padding:24px 16px 60px;}
  .wrap{max-width:900px;margin:0 auto;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#fff;border-radius:14px;padding:20px 26px;margin-bottom:18px;}
  header h1{margin:0 0 4px;font-size:1.3rem;}
  a.back{color:#cbd6e2;font-size:.82rem;text-decoration:none;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border);}
  thead th{background:var(--light);text-align:left;padding:9px 12px;font-size:.72rem;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
  tbody td{padding:8px 12px;font-size:.87rem;border-bottom:1px solid #eef1f5;}
  tbody input{width:90px;border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:.85rem;font-family:inherit;}
  .savedTag{font-size:.72rem;color:var(--green);margin-left:6px;opacity:0;transition:opacity .3s;}
  .savedTag.show{opacity:1;}
  .addRow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .addRow input{border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:.87rem;font-family:inherit;}
  .addRow button{border:none;background:var(--navy);color:#fff;border-radius:7px;padding:7px 14px;font-size:.85rem;font-weight:600;cursor:pointer;}

  @media (max-width: 480px){
    body{padding:14px 10px 40px;}
    header{padding:16px 18px;}
    header h1{font-size:1.1rem;}
    thead th, tbody td{padding:7px 8px;}
    tbody input{width:70px;}
    /* Mind. 16px, sonst zoomt iOS Safari beim Antippen eines Feldes automatisch hinein. */
    input, button{font-size:16px;}
    .addRow{flex-direction:column;align-items:stretch;}
    .addRow input, .addRow button{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">← zur Übersicht</a>
    <h1>📦 Lagerbestand (zentral, für alle Nutzer)</h1>
  </header>
  <table>
    <thead><tr><th>Bezeichnung</th><th>Ist-Bestand</th><th>EK-Preis (€)</th><th></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="addRow">
    <input type="text" id="newName" placeholder="Neues Ersatzteil...">
    <input type="number" id="newBestand" placeholder="Bestand" value="0">
    <input type="number" id="newPreis" placeholder="EK-Preis €" step="0.01">
    <button id="addBtn">+ Hinzufügen</button>
  </div>
</div>
<script>
async function load(){
  const res = await fetch('/api/lager');
  const data = await res.json();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = Object.entries(data).sort((a,b)=>a[0].localeCompare(b[0],'de')).map(([name,v])=>`
    <tr>
      <td>${name}</td>
      <td><input type="number" min="0" data-name="${name}" data-field="bestand" value="${v.bestand}"></td>
      <td><input type="number" min="0" step="0.01" data-name="${name}" data-field="ekPreis" value="${v.ekPreis ?? ''}"></td>
      <td><span class="savedTag" id="tag-${cssId(name)}">gespeichert ✓</span></td>
    </tr>
  `).join('');
  tbody.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const name = inp.dataset.name, field = inp.dataset.field;
      const body = {};
      body[field] = inp.value === '' ? null : Number(inp.value);
      await fetch('/api/lager/' + encodeURIComponent(name), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const tag = document.getElementById('tag-' + cssId(name));
      tag.classList.add('show');
      setTimeout(()=>tag.classList.remove('show'), 1500);
    });
  });
}
function cssId(name){ return name.replace(/[^a-zA-Z0-9]/g,'_'); }
document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('newName').value.trim();
  if(!name) return;
  const bestand = Number(document.getElementById('newBestand').value) || 0;
  const ekPreis = document.getElementById('newPreis').value === '' ? null : Number(document.getElementById('newPreis').value);
  await fetch('/api/lager/' + encodeURIComponent(name), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({bestand, ekPreis}) });
  document.getElementById('newName').value=''; document.getElementById('newBestand').value=0; document.getElementById('newPreis').value='';
  load();
});
load();
</script>
</body>
</html>
